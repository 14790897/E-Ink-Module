<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ink 小说阅读器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .book-list {
            display: grid;
            gap: 15px;
        }

        .book-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .book-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .book-info {
            flex: 1;
        }

        .book-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .book-meta {
            font-size: 12px;
            color: #666;
        }

        .book-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .upload-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-input-label {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .file-input-wrapper:hover .file-input-label {
            background: #5568d3;
        }

        .file-name {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .status {
            padding: 20px;
            background: #e7f3ff;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .status-label {
            color: #666;
        }

        .status-value {
            font-weight: bold;
            color: #333;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 E-Ink 小说阅读器</h1>
            <p>支持上传小说并在E-Ink屏幕上阅读</p>
        </div>

        <div class="content">
            <!-- 设备状态 -->
            <div class="section">
                <h2 class="section-title">📊 设备状态</h2>
                <div class="status">
                    <div class="status-item">
                        <span class="status-label">当前页码：</span>
                        <span class="status-value" id="currentPage">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">总页数：</span>
                        <span class="status-value" id="totalPages">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">当前书籍：</span>
                        <span class="status-value" id="currentBook">无</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">存储空间：</span>
                        <span class="status-value" id="storage">加载中...</span>
                    </div>
                </div>
            </div>

            <!-- 上传小说 -->
            <div class="section">
                <h2 class="section-title">📤 上传小说</h2>
                <div class="upload-section">
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" accept=".txt">
                        <label class="file-input-label">选择TXT文件</label>
                    </div>
                    <div class="file-name" id="fileName">未选择文件</div>
                    <button class="btn btn-primary" onclick="uploadBook()">上传</button>
                </div>
            </div>

            <!-- 书籍列表 -->
            <div class="section">
                <h2 class="section-title">📚 书籍列表</h2>
                <div class="book-list" id="bookList">
                    <div style="text-align: center; color: #999; padding: 20px;">
                        暂无书籍，请上传
                    </div>
                </div>
            </div>

            <!-- 加载提示 -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>处理中...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
